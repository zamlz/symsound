[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daw"
version = "0.1.0"
requires-python = ">= 3.11"
description = "A mathematical and programmatic audio engine"
authors = [
    { name = "Amlesh Sivanantham", email = "zamlz+publict@pm.me" }
]
dependencies = [
  "matplotlib",
  "numpy",
  "sounddevice",
  "soundfile",
  "sympy"
]

[project.optional-dependencies]
develop = [
  "ipdb",
  "ipython",
  "mypy"
]

[[tool.mypy.overrides]]
module = [
  "sounddevice",
  "soundfile",
  "sympy"
]
ignore_missing_imports = true
