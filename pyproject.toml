[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daw"
version = "0.1.0"
requires-python = ">= 3.14"
description = "A mathematical and programmatic audio engine"
authors = [
    { name = "Amlesh Sivanantham", email = "zamlz+publict@pm.me" }
]
dependencies = [
  "matplotlib",
  "numpy",
  "sounddevice",
  "soundfile",
  "sympy",
  "sympy.*"
]

[project.optional-dependencies]
develop = [
  "ipdb",
  "ipython",
  "mypy",
  "pytest",
  "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["daw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "SIM300"]

[tool.ruff.lint.per-file-ignores]
# Example scripts import freely and run at import time
"examples/*.py" = ["F401", "E402"]

[[tool.mypy.overrides]]
module = [
  "sounddevice",
  "soundfile",
  "sympy",
  "sympy.*"
]
ignore_missing_imports = true
