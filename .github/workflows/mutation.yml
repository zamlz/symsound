name: mutation

on:
  # Nightly. A surviving mutant fails the run, which GitHub emails to you
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      filters:
        description: "Only run mutants whose label contains one of these words (blank runs all)"
        required: false
        default: ""

jobs:
  mutation:
    # Scheduled runs only happen on the default branch
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: |
          # shellcheck disable=SC2086
          # (the filters are separate words on purpose)
          nix develop -c python tools/mutation_check.py $FILTERS
        env:
          FILTERS: ${{ inputs.filters }}
