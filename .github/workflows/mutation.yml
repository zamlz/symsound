name: mutation

# Proves the tests catch bugs by breaking the code on purpose (see
# tools/mutation_check.py). Each mutant runs only its own tests, so the whole
# set takes minutes, not hours.
#   nightly      every mutant, but only if the code changed since the last
#                green run (otherwise that result still stands)
#   on demand    from the Actions tab, optionally filtered by label
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      filters:
        description: "Only run mutants whose label contains one of these words (blank runs all)"
        required: false
        default: ""

jobs:
  mutation:
    # Scheduled runs only happen on the default branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether anything changed
        id: plan
        run: |
          # Only scheduled runs count as "last green": an on-demand run may have
          # been filtered to a few mutants
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(gh run list --workflow mutation --event schedule --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""')
            if [ -n "$last" ] && git cat-file -e "$last" 2>/dev/null \
              && git diff --quiet "$last" HEAD -- src tests tools/mutation_check.py; then
              echo "Nothing changed since the last green run ($last): skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: cachix/install-nix-action@v31
        if: steps.plan.outputs.skip != 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Mutation check
        if: steps.plan.outputs.skip != 'true'
        env:
          FILTERS: ${{ inputs.filters }}
        run: |
          # shellcheck disable=SC2086
          # (the filters are separate words on purpose)
          nix develop -c python tools/mutation_check.py $FILTERS
