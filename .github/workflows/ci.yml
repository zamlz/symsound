name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same command as locally: pytest (100% coverage), ruff, mypy, and the
  # docs freshness check (regenerates every graph and compares the bytes)
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --print-build-logs

# Mutation checking takes a long time (about a minute per mutant), so it runs
# on demand from the Actions tab (workflow "mutation") instead of on every push
