name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each tool runs as its own step, so its output is right there in the log.
  # `nix flake check` at the end is the same gate as locally; it re-runs
  # everything in the Nix sandbox and also proves the flake itself evaluates.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Lint (ruff)
        run: nix develop -c ruff check --output-format=github .
      - name: Types (mypy)
        run: nix develop -c mypy src/daw
      - name: Tests and coverage (pytest)
        run: nix develop -c pytest -p no:cacheprovider
      - name: Docs are up to date
        run: nix develop -c python tools/build_docs.py --check
      - name: Flake check
        run: nix flake check --print-build-logs
